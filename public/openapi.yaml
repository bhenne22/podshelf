openapi: 3.0.3
info:
  title: Podshelf API
  version: '1.0'
  description: |
    HTTP API for [Podshelf](https://github.com/bhenne22/podshelf), the
    self-hosted multi-tenant podcast publishing platform.

    ## Authentication

    Every endpoint (except `GET /healthz`) requires authentication. Two
    schemes are accepted:

    - **API key** (preferred for automation) — `X-Api-Key: <key>` header
      or `Authorization: Bearer <key>`. Generate one at `/api-keys`.
      Keys can be scoped to specific podcasts and have a permission
      level (`read` / `write` / `full`). Click **Authorize** above to
      paste your key and try things out.
    - **Session cookie** — set by `POST /api/auth/login`. Used by the
      web UI; not recommended for automation.

    ## Rate limits

    Podshelf doesn't enforce rate limits on its own — it's a self-hosted
    install, so any limits come from your reverse proxy or the upstream
    services your endpoints call (storage adapter, GitHub, webhook).
servers:
  - url: '{site_url}'
    description: Your Podshelf instance
    variables:
      site_url:
        default: ''
        description: |
          Base URL of your Podshelf install (e.g. `https://podshelf.example.com`).
          Leave blank to use the same origin you're viewing these docs on.

# Default to API-key auth so the "Try it out" experience matches the
# automation use case. Cookie auth still works for the same endpoints
# when called from the browser session.
security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Identity
    description: Auth + current user
  - name: Podcasts
    description: Podcast CRUD, settings, soft-delete, restore, purge
  - name: Episodes
    description: Episode CRUD, duplicate, chapters
  - name: People
    description: Per-podcast roster of hosts/guests + per-episode attachments
  - name: Distribution
    description: Per-podcast "Listen on" destinations (Apple, Spotify, etc.)
  - name: Networks
    description: Groupings of podcasts; implicit membership via podcast_users for read access. Mutations are admin-only.
  - name: Uploads & files
    description: Audio / artwork / transcript / chapters file uploads + file browser
  - name: Storage
    description: Storage adapter config, test, and end-to-end migration
  - name: Webhook & build
    description: Publish webhooks + GitHub repository_dispatch integration
  - name: Migration
    description: RSS / JSON archive import + export, slug aliases
  - name: Audit
    description: Per-podcast audit log
  - name: Misc
    description: Health check, audio probe

paths:
  # ---------------------------------------------------------------- Identity
  /api/auth/login:
    post:
      tags: [Identity]
      summary: Log in (sets session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: 'Logged in; `Set-Cookie: session=...` header is set.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Identity]
      summary: Clear the session cookie
      responses:
        '200':
          description: Session cleared.

  /api/me:
    get:
      tags: [Identity]
      summary: Current user
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Podcasts
  /api/podcasts:
    get:
      tags: [Podcasts]
      summary: List podcasts you can access
      responses:
        '200':
          description: Podcasts the authenticated user is a member of (admins see all).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Podcast' }
    post:
      tags: [Podcasts]
      summary: Create a podcast (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                slug:  { type: string, description: 'Lowercase letters, digits, hyphens. Auto-derived from title when omitted.' }
                description: { type: string }
                author: { type: string }
                email: { type: string, format: email }
                website: { type: string, format: uri }
                language: { type: string, default: en }
                category: { type: string, default: 'Society & Culture' }
                explicit: { type: string, enum: ['true', 'false'], default: 'false' }
                storage_adapter: { type: string, enum: [sftp, s3], default: sftp }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Podcast' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/podcasts/{slug}:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Podcasts]
      summary: Get podcast metadata
      responses:
        '200':
          description: The podcast row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Podcast' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Podcasts]
      summary: Update podcast metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Send only the fields you want to change. Editable: `slug`,
                `title`, `description`, `author`, `email`, `image_url`,
                `language`, `copyright`, `category`, `explicit`, `website`,
                `audio_tracking_prefix`, `itunes_type`, `podcast_locked`,
                `itunes_complete`, `itunes_block`, `funding_url`,
                `funding_label`, `verify_txt`, `license_identifier`,
                `license_url`, `episode_title_template`,
                `episode_description_template`, `storage_adapter`,
                `github_owner`, `github_repo`, `github_event_type`,
                `lifecycle` (one of `active`, `inactive`, `retired`),
                `build_admin_only` (admin-only field; non-admins get 403).

                Changing `slug` adds the previous slug to `slug_aliases`
                so old subscribers continue to receive the feed (with an
                `<itunes:new-feed-url>` redirect tag).
              additionalProperties: true
      responses:
        '200':
          description: Updated podcast.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Podcast' }
        '409':
          description: Slug collision (with another active podcast or with another podcast's reserved alias).
    delete:
      tags: [Podcasts]
      summary: Soft-delete (RSS feed 404s; restorable)
      responses:
        '204':
          description: Soft-deleted.

  /api/podcasts/{slug}/restore:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Podcasts]
      summary: Reverse a soft-delete
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  alreadyActive: { type: boolean }

  /api/podcasts/{slug}/purge:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    delete:
      tags: [Podcasts]
      summary: Permanent delete (admin only; requires soft-deleted)
      responses:
        '204':
          description: Purged.
        '409':
          description: Podcast must be soft-deleted (`status = 'inactive'`) first.

  /api/admin/inactive-podcasts:
    get:
      tags: [Podcasts]
      summary: List soft-deleted podcasts (admin only)
      responses:
        '200':
          description: Inactive podcasts ordered by `deleted_at` DESC.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Podcast' }

  # ---------------------------------------------------------------- Episodes
  /api/podcasts/{slug}/episodes:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Episodes]
      summary: List episodes
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, scheduled, published] }
        - in: query
          name: slug
          description: Fetch a single episode by per-podcast slug.
          schema: { type: string }
      responses:
        '200':
          description: Episodes (ordered by `published_at` desc, drafts last).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Episode' }
                  - { $ref: '#/components/schemas/Episode' }
                  - { type: 'null' }
    post:
      tags: [Episodes]
      summary: Create an episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/EpisodeWritable' }
                - type: object
                  required: [title]
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Episode' }

  /api/podcasts/{slug}/episodes/{id}:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/EpisodeId' }
    patch:
      tags: [Episodes]
      summary: Update an episode
      description: |
        Setting `status: published` together with a `published_at` in the
        future stores the episode as `scheduled`; the in-process scheduler
        flips it to `published` (firing the webhook + GitHub trigger) when
        the time hits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EpisodeWritable' }
      responses:
        '200':
          description: Updated episode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Episode' }
    delete:
      tags: [Episodes]
      summary: Permanently delete an episode
      responses:
        '204':
          description: Deleted.

  /api/podcasts/{slug}/episodes/{id}/duplicate:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/EpisodeId' }
    post:
      tags: [Episodes]
      summary: Duplicate an episode into a fresh draft
      description: |
        Carries: description, tags, image_url + filename, season_number,
        season_name, episode_type, itunes_title/author, license override,
        and people attachments (with role/group frozen at duplicate time).
        Clears: audio file, chapters URL, transcript path/type,
        episode_number, episode_display, published_at, GUID. Title gets
        " (Copy)" appended; slug derives uniquely from the source slug.
      responses:
        '201':
          description: New draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Episode' }

  /api/podcasts/{slug}/episodes/{id}/chapters:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/EpisodeId' }
    post:
      tags: [Episodes]
      summary: Build chapters JSON from a textarea-style list
      description: |
        Parses `text` (each line `MM:SS Title` or `HH:MM:SS Title` with
        optional ` | url` suffix), serializes the result as Podcasting 2.0
        chapters JSON, uploads it to the audio storage directory next to
        the MP3, and persists `chapters_url` on the episode. Sending an
        empty `text` clears the chapters URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: |
                    00:00 Intro
                    05:30 Topic one | https://example.com/topic-one
                    12:15 Guest interview
      responses:
        '200':
          description: Chapters URL persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chapters_url: { type: string, nullable: true, format: uri }
                  count: { type: integer }

  /api/podcasts/{slug}/episodes/template:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Episodes]
      summary: Render the new-episode templates + suggested numbers
      description: |
        Returns the rendered title and description templates and suggested
        next season/episode numbers — used by the New Episode form to pre-
        fill. Placeholders supported in the templates: `{season}`,
        `{episode}`, `{date}` (today as YYYY-MM-DD).
      responses:
        '200':
          description: Rendered templates + suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  description: { type: string }
                  season_number: { type: integer, nullable: true }
                  episode_number: { type: integer }

  /api/podcasts/{slug}/episodes/{id}/people:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/EpisodeId' }
    get:
      tags: [People]
      summary: List people attached to this episode
      responses:
        '200':
          description: Attachments + the joined person's current name/img/href.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EpisodePerson' }
    post:
      tags: [People]
      summary: Attach a person to this episode
      description: |
        `role` and `group` default to the person's `default_role` /
        `default_group` and are then **frozen** on the attachment row —
        later edits to the person's defaults won't rewrite this episode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person_id]
              properties:
                person_id: { type: integer }
                role: { type: string }
                group: { type: string }
      responses:
        '200':
          description: Attachment created (or updated, if already present).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpisodePerson' }

  /api/podcasts/{slug}/episodes/{id}/people/{attachId}:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/EpisodeId' }
      - in: path
        name: attachId
        required: true
        schema: { type: integer }
    delete:
      tags: [People]
      summary: Detach a person from this episode
      responses:
        '200':
          description: Detached.

  # ---------------------------------------------------------------- People
  /api/podcasts/{slug}/people:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [People]
      summary: Roster — list all people for the podcast
      responses:
        '200':
          description: Roster ordered by auto_attach desc, then name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Person' }
    post:
      tags: [People]
      summary: Add a person to the roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                img_url: { type: string, format: uri, nullable: true }
                href: { type: string, format: uri, nullable: true }
                default_role: { type: string, default: host, example: host }
                default_group: { type: string, default: cast, example: cast }
                auto_attach: { type: boolean, default: false }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }

  /api/podcasts/{slug}/people/{id}:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/PersonId' }
    patch:
      tags: [People]
      summary: Update a roster record
      description: |
        Existing `episode_people` attachment rows are NOT rewritten — past
        episodes preserve the role/group they were attached with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated person.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
    delete:
      tags: [People]
      summary: Remove from roster (cascades to all attachments)
      responses:
        '200':
          description: Removed.

  # ---------------------------------------------------------------- Distribution
  /api/podcasts/{slug}/distribution:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Distribution]
      summary: List "Listen on" destinations
      description: |
        Pure metadata — not surfaced in the RSS feed. A static-site build can
        fetch this list on each rebuild to render a "Listen on" block.
      responses:
        '200':
          description: Destinations in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Distribution' }
    post:
      tags: [Distribution]
      summary: Add a destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Apple Podcasts }
                url: { type: string, format: uri, nullable: true, example: 'https://podcasts.apple.com/us/podcast/.../id1234567890' }
                platform_id: { type: string, nullable: true, description: 'Platform-specific show ID (Apple show ID, Spotify URI, etc).' }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Distribution' }

  /api/podcasts/{slug}/distribution/{id}:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - { $ref: '#/components/parameters/DistributionId' }
    patch:
      tags: [Distribution]
      summary: Update a destination
      description: |
        `position` is owned by the reorder endpoint and cannot be set here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                url: { type: string, format: uri, nullable: true }
                platform_id: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Distribution' }
    delete:
      tags: [Distribution]
      summary: Remove a destination
      responses:
        '200':
          description: Removed.

  /api/podcasts/{slug}/distribution/reorder:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Distribution]
      summary: Reorder destinations
      description: |
        The body must contain exactly the same set of ids the podcast currently
        has. Partial reorders are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  example: [3, 1, 2]
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }

  # ---------------------------------------------------------------- Networks
  /api/networks:
    get:
      tags: [Networks]
      summary: List networks the caller can read
      description: |
        Admins see all networks. Non-admins see only networks whose active-
        podcast set intersects their `podcast_users` membership. Scoped API
        keys further restrict to networks whose podcasts intersect the key
        scope.
      parameters:
        - in: query
          name: podcastSlug
          required: false
          description: Restrict to networks containing this podcast (used by the in-app conflict hint).
          schema: { type: string }
      responses:
        '200':
          description: Networks the caller can read.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetworkListItem' }

  /api/networks/{slug}:
    parameters:
      - { $ref: '#/components/parameters/NetworkSlug' }
    get:
      tags: [Networks]
      summary: Network detail with active-podcast roster
      responses:
        '200':
          description: Network detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/networks/{slug}/upcoming-episodes:
    parameters:
      - { $ref: '#/components/parameters/NetworkSlug' }
    get:
      tags: [Networks]
      summary: Aggregated upcoming episodes across the network
      description: |
        Drafts excluded. A scoped API key only sees episodes for podcasts
        inside the key's scope — networks never widen a key's data view.
      parameters:
        - in: query
          name: from
          required: false
          description: ISO datetime lower bound (default now).
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          description: ISO datetime upper bound (default now + 60 days).
          schema: { type: string, format: date-time }
        - in: query
          name: excludePodcast
          required: false
          description: Podcast slug to omit (used by the inline hint for the host's own show).
          schema: { type: string }
      responses:
        '200':
          description: Upcoming episodes ordered by published_at ascending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  episodes:
                    type: array
                    items: { $ref: '#/components/schemas/NetworkUpcomingEpisode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/networks:
    get:
      tags: [Networks]
      summary: Admin list of all networks
      responses:
        '200':
          description: All networks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetworkListItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Networks]
      summary: Create a network (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                slug: { type: string, nullable: true, description: Auto-derived from title if blank. Must not collide with any podcast slug. }
                title: { type: string }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Slug already in use by a network or podcast. }

  /api/admin/networks/{id}:
    parameters:
      - { $ref: '#/components/parameters/NetworkId' }
    get:
      tags: [Networks]
      summary: Admin network detail (includes inactive podcasts)
      responses:
        '200':
          description: Network detail with full roster (inactive podcasts included).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Networks]
      summary: Edit network metadata (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                slug: { type: string }
                title: { type: string }
                description: { type: string, nullable: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '409': { description: Slug already in use. }
    delete:
      tags: [Networks]
      summary: Hard-delete a network (admin only)
      responses:
        '200':
          description: Deleted.

  /api/admin/networks/{id}/podcasts:
    parameters:
      - { $ref: '#/components/parameters/NetworkId' }
    post:
      tags: [Networks]
      summary: Add a podcast to a network (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [podcast_id]
              properties:
                podcast_id: { type: integer }
                position: { type: integer, nullable: true }
      responses:
        '200':
          description: Updated roster.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetworkPodcast' }

  /api/admin/networks/{id}/podcasts/{podcast_id}:
    parameters:
      - { $ref: '#/components/parameters/NetworkId' }
      - in: path
        name: podcast_id
        required: true
        schema: { type: integer }
    patch:
      tags: [Networks]
      summary: Update a membership's position (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer }
      responses:
        '200':
          description: Updated roster.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetworkPodcast' }
    delete:
      tags: [Networks]
      summary: Remove a podcast from a network (admin only)
      responses:
        '200':
          description: Removed.

  # ---------------------------------------------------------------- Network custom properties
  /api/networks/{slug}/property-definitions:
    parameters:
      - { $ref: '#/components/parameters/NetworkSlug' }
    get:
      tags: [Networks]
      summary: List a network's custom property schema
      responses:
        '200':
          description: Property definitions ordered by position.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetworkPropertyDefinition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/networks/{slug}/properties:
    parameters:
      - { $ref: '#/components/parameters/NetworkSlug' }
    get:
      tags: [Networks]
      summary: Flat list of property values across the network roster
      description: |
        Orphan keys (values whose definition has been deleted) are dropped
        from the response. A scoped API key only sees values for podcasts
        inside its scope.
      responses:
        '200':
          description: Property values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: array
                    items: { $ref: '#/components/schemas/NetworkPropertyEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/networks/{id}/property-definitions:
    parameters:
      - { $ref: '#/components/parameters/NetworkId' }
    get:
      tags: [Networks]
      summary: Admin mirror of property definitions list
      responses:
        '200':
          description: Property definitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NetworkPropertyDefinition' }
    post:
      tags: [Networks]
      summary: Define a new custom property (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, type]
              properties:
                key:
                  type: string
                  description: 'Must match ^[a-zA-Z][a-zA-Z0-9_]*$.'
                label: { type: string }
                type:
                  type: string
                  enum: [string, boolean, number, url, color]
                required: { type: boolean, default: false }
                position: { type: integer, nullable: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPropertyDefinition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A property with this key already exists on this network. }

  /api/admin/networks/{id}/property-definitions/{key}:
    parameters:
      - { $ref: '#/components/parameters/NetworkId' }
      - in: path
        name: key
        required: true
        schema: { type: string }
    patch:
      tags: [Networks]
      summary: Update a property definition (admin only)
      description: |
        When `type` changes, every existing value must coerce under the new
        type — otherwise the request 409s with the offending value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string }
                type:
                  type: string
                  enum: [string, boolean, number, url, color]
                required: { type: boolean }
                position: { type: integer }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPropertyDefinition' }
        '409': { description: Existing value cannot coerce to the new type. }
    delete:
      tags: [Networks]
      summary: Drop a definition and cascade its values (admin only)
      responses:
        '200':
          description: Deleted with cleared value count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  values_cleared: { type: integer }

  /api/admin/networks/{id}/podcasts/{podcast_id}/properties/{key}:
    parameters:
      - { $ref: '#/components/parameters/NetworkId' }
      - in: path
        name: podcast_id
        required: true
        schema: { type: integer }
      - in: path
        name: key
        required: true
        schema: { type: string }
    put:
      tags: [Networks]
      summary: Set a property value (admin only)
      description: |
        Validated against the property's declared type. Blank values are
        rejected — use DELETE to clear.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { description: 'Type-coerced per the property definition.' }
      responses:
        '200':
          description: Persisted value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }
                  type: { type: string }
        '404': { description: Property not defined on this network, or podcast not in network. }
    delete:
      tags: [Networks]
      summary: Clear a property value (admin only)
      responses:
        '200':
          description: Cleared (idempotent).

  # ---------------------------------------------------------------- Uploads & files
  /api/podcasts/{slug}/upload:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
      - in: query
        name: kind
        schema: { type: string, enum: [audio, artwork, transcript, chapters], default: audio }
    post:
      tags: [Uploads & files]
      summary: Upload a file via the podcast's storage adapter
      description: |
        Multipart form upload. Field name: `file`. The file is sent through
        whichever storage adapter (SFTP / S3) is configured for the
        podcast. Transcripts and chapters land in the audio directory
        (sidecar to the MP3) — Podshelf manages podcasts but doesn't host
        listener-facing content.

        | `kind`     | Allowed types                                         | Max     |
        |------------|-------------------------------------------------------|---------|
        | audio      | mpeg/mp3/mp4/m4a/aac/ogg/wav/flac                     | 500 MB  |
        | artwork    | jpeg/png/webp                                         | 25 MB   |
        | transcript | html/txt/srt/vtt/json (MIME or extension)             | 10 MB   |
        | chapters   | application/json (Podcasting 2.0 chapters JSON)       | 2 MB    |

        Returns `{ url, filename, size, content_type, kind }`. Pass the
        `url` (and optionally `content_type`) into the appropriate fields
        on episode create/update.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
        '409':
          description: A storage migration is in progress; uploads are locked.
        '413':
          description: File too large.

  /api/podcasts/{slug}/files:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Uploads & files]
      summary: List files in the audio or artwork directory
      parameters:
        - in: query
          name: kind
          required: true
          schema: { type: string, enum: [audio, artwork] }
      responses:
        '200':
          description: Directory listing with in-use flags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  publicUrlBase: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size: { type: integer }
                        modifiedAt: { type: string, format: date-time, nullable: true }
                        url: { type: string, format: uri }
                        inUse: { type: boolean }
                        usedBy:
                          type: array
                          items: { type: string }

  /api/podcasts/{slug}/files/delete:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Uploads & files]
      summary: Delete a file from the storage directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [audio, artwork] }
                name: { type: string }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Deleted.
        '409':
          description: File is referenced by an episode; resend with `force=true` to delete anyway.

  /api/podcasts/{slug}/files/rename:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Uploads & files]
      summary: Rename a file in the storage directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fromName, toName]
              properties:
                kind: { type: string, enum: [audio, artwork] }
                fromName: { type: string }
                toName: { type: string }
      responses:
        '200':
          description: Renamed; references in episodes are updated.

  # ---------------------------------------------------------------- Storage
  /api/podcasts/{slug}/storage:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Storage]
      summary: Describe the active storage config (redacted)
      responses:
        '200':
          description: Adapter + non-secret fields. Secrets are never returned.
    post:
      tags: [Storage]
      summary: Save storage config (encrypted at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapter, config]
              properties:
                adapter: { type: string, enum: [sftp, s3] }
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Saved.

  /api/podcasts/{slug}/storage/test:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Storage]
      summary: Test connectivity to a candidate storage config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapter, config]
              properties:
                adapter: { type: string, enum: [sftp, s3] }
                config: { type: object, additionalProperties: true }
                kind: { type: string, enum: [audio, artwork], default: audio }
      responses:
        '200':
          description: Connected; returns a small directory listing.

  /api/podcasts/{slug}/storage/migrate:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Storage]
      summary: Most-recent migration row (for polling progress)
      responses:
        '200':
          description: Migration state, or null when nothing's been queued.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/StorageMigration' }
                  - { type: 'null' }
    post:
      tags: [Storage]
      summary: Queue an end-to-end storage migration
      description: |
        The in-process worker copies every file from the current adapter
        to the target, then atomically rewrites every URL across
        `episodes` + `podcasts` and swaps `storage_config_encrypted`.
        Source files are NOT deleted. Re-runs after a failed migration
        skip files already present at the target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapter, config]
              properties:
                adapter: { type: string, enum: [sftp, s3] }
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageMigration' }
        '409':
          description: A migration is already in progress for this podcast.

  # ---------------------------------------------------------------- GitHub + webhook
  /api/podcasts/{slug}/github:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Webhook & build]
      summary: Describe GitHub config (redacted)
      responses:
        '200':
          description: Owner / repo / event_type / has-token / auto_trigger flag.
    post:
      tags: [Webhook & build]
      summary: Save GitHub repository_dispatch config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, repo, event_type]
              properties:
                owner: { type: string }
                repo: { type: string }
                event_type: { type: string }
                token: { type: string, description: 'PAT with repo dispatch scope. Omit to keep existing.' }
                auto_trigger: { type: boolean }
      responses:
        '200':
          description: Saved.

  /api/podcasts/{slug}/github/test:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Webhook & build]
      summary: Verify the GitHub PAT can dispatch
      responses:
        '200': { description: Token works. }

  /api/podcasts/{slug}/github/trigger:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Webhook & build]
      summary: Manually fire a repository_dispatch
      description: |
        Open to any podcast member (the configuration form is admin-gated
        when `build_admin_only=true`, but firing the saved config is not).
        Also clears any pending-changes window so the banner disappears.
      responses:
        '200':
          description: Dispatched.

  /api/podcasts/{slug}/publish-status:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Webhook & build]
      summary: Pending-changes / build state for the global banner
      description: |
        Read-only view available to any podcast member regardless of
        `build_admin_only`. No secrets exposed (no token, no owner/repo
        details for unconfigured podcasts).
      responses:
        '200':
          description: Pending state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  auto_trigger: { type: boolean }
                  pending:
                    type: object
                    properties:
                      first_at:       { type: string, format: date-time, nullable: true }
                      last_at:        { type: string, format: date-time, nullable: true }
                      scheduled_for:  { type: string, format: date-time, nullable: true }
                      debounce_minutes: { type: integer }

  /api/podcasts/{slug}/webhook:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Webhook & build]
      summary: Describe publish-webhook config (redacted)
      description: 'Returns `{ has_url, format, enabled, url_host }`. URL itself is encrypted at rest and never returned.'
      responses:
        '200':
          description: Redacted webhook config.
    post:
      tags: [Webhook & build]
      summary: Save publish-webhook config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, enabled]
              properties:
                url:
                  type: string
                  format: uri
                  description: Omit to keep existing; empty string clears.
                format: { type: string, enum: [discord, slack, generic] }
                enabled: { type: boolean }
      responses:
        '200':
          description: Saved.

  /api/podcasts/{slug}/webhook/test:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Webhook & build]
      summary: Send a synthetic test event through the webhook
      responses:
        '200':
          description: Delivered.
        '502':
          description: Upstream rejected the request; body has the error.

  # ---------------------------------------------------------------- Migration
  /api/podcasts/{slug}/import-rss:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Migration]
      summary: Import episodes from an external RSS feed
      description: One-shot operation; only allowed while the podcast has no episodes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feed_url]
              properties:
                feed_url: { type: string, format: uri }
      responses:
        '200':
          description: Import result.
        '409':
          description: Podcast already has episodes.

  /api/podcasts/{slug}/export.json:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Migration]
      summary: Export the full Podshelf archive (JSON)
      description: |
        Includes settings, every episode (drafts + scheduled + published),
        people, episode_people, slug_aliases. Excludes secrets (storage /
        GitHub / webhook URLs), members, api_keys, audit_log, downloads.
      responses:
        '200':
          description: 'Archive JSON; served with `Content-Disposition: attachment`.'
          content:
            application/json: {}

  /api/podcasts/{slug}/import-json:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    post:
      tags: [Migration]
      summary: Import a Podshelf archive into an empty podcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The full archive object as returned by `export.json`.
      responses:
        '200':
          description: Imported counts + which settings were backfilled.
        '409':
          description: Podcast already has episodes.

  /api/podcasts/{slug}/aliases:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Migration]
      summary: List previous slugs (still serving the feed via redirect tag)
      responses:
        '200':
          description: Chronological list of old slugs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    old_slug: { type: string }
                    created_at: { type: string, format: date-time }

  # ---------------------------------------------------------------- Audit
  /api/podcasts/{slug}/audit:
    parameters:
      - { $ref: '#/components/parameters/Slug' }
    get:
      tags: [Audit]
      summary: Audit log for this podcast (paginated)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: before
          description: Return rows with `id < before` (cursor pagination).
          schema: { type: integer }
      responses:
        '200':
          description: Page of audit rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  has_more: { type: boolean }
                  next_before: { type: integer, nullable: true }

  # ---------------------------------------------------------------- Misc
  /healthz:
    get:
      tags: [Misc]
      summary: Health check
      security: []
      responses:
        '200':
          description: 'Healthy: `{ "status": "ok" }`.'
        '503':
          description: 'DB ping failed; body includes the error.'

  /api/audio-probe:
    get:
      tags: [Misc]
      summary: HEAD-probe an external audio URL for size + content-type
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: '`{ size, contentType }`.'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Per-user API key. Generate one at `/api-keys` in the web UI.
        Keys can be scoped to specific podcasts and have a permission
        level (`read` / `write` / `full`).
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Same key as `X-Api-Key`, sent as `Authorization: Bearer <key>`.'

  parameters:
    Slug:
      in: path
      name: slug
      required: true
      description: Per-podcast slug.
      schema: { type: string }
    EpisodeId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    PersonId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    DistributionId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    NetworkSlug:
      in: path
      name: slug
      required: true
      description: Network slug.
      schema: { type: string }
    NetworkId:
      in: path
      name: id
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Authentication missing or invalid.
    Forbidden:
      description: Authenticated but not authorized for this resource.
    NotFound:
      description: Resource not found.

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        is_admin: { type: boolean }

    Podcast:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        author: { type: string, nullable: true }
        email: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        language: { type: string, nullable: true }
        copyright: { type: string, nullable: true }
        category: { type: string, nullable: true }
        explicit: { type: string, enum: ['true', 'false'], nullable: true }
        website: { type: string, nullable: true }
        audio_tracking_prefix: { type: string, nullable: true }
        itunes_type: { type: string, enum: [episodic, serial], nullable: true }
        podcast_locked: { type: string, enum: [yes, no], nullable: true }
        itunes_complete: { type: string, enum: [yes, no], nullable: true }
        itunes_block: { type: string, enum: [yes, no], nullable: true }
        funding_url: { type: string, nullable: true }
        funding_label: { type: string, nullable: true }
        verify_txt: { type: string, nullable: true }
        license_identifier: { type: string, nullable: true }
        license_url: { type: string, nullable: true }
        episode_title_template: { type: string, nullable: true }
        episode_description_template: { type: string, nullable: true }
        storage_adapter: { type: string, enum: [sftp, s3] }
        github_owner: { type: string, nullable: true }
        github_repo: { type: string, nullable: true }
        github_event_type: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        lifecycle:
          type: string
          enum: [active, inactive, retired]
          description: 'Podshelf-only publishing lifecycle (Active / Inactive / Retired). Independent of soft-delete `status`; not surfaced in the RSS feed.'
        build_admin_only:
          type: boolean
          description: |
            When true (default), the Build page configuration form is gated
            to admins. The Rebuild Now banner / `/github/trigger` endpoint
            stay open to all podcast members regardless. Only admins can
            change this field.
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Episode:
      allOf:
        - { $ref: '#/components/schemas/EpisodeWritable' }
        - type: object
          properties:
            id: { type: integer }
            podcast_id: { type: integer }
            guid: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    EpisodeWritable:
      type: object
      description: Fields accepted by the create / update endpoints.
      properties:
        title: { type: string }
        slug: { type: string, description: 'Auto-derived from title when blank.' }
        episode_number: { type: integer, nullable: true }
        season_number: { type: integer, nullable: true }
        description: { type: string, nullable: true, description: 'HTML allowed; rendered as the episode show notes.' }
        audio_url: { type: string, format: uri, nullable: true }
        audio_filename: { type: string, nullable: true }
        audio_size_bytes: { type: integer, nullable: true }
        audio_duration_seconds: { type: integer, nullable: true }
        image_url: { type: string, format: uri, nullable: true }
        image_filename: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [draft, scheduled, published] }
        tags: { type: string, nullable: true, description: 'Comma-separated.' }
        transcript_path: { type: string, format: uri, nullable: true }
        transcript_type:
          type: string
          enum: [text/html, text/plain, application/srt, text/vtt, application/json]
          nullable: true
        chapters_url: { type: string, format: uri, nullable: true }
        episode_type: { type: string, enum: [full, trailer, bonus], default: full }
        itunes_title: { type: string, nullable: true }
        itunes_author: { type: string, nullable: true }
        itunes_explicit: { type: string, enum: ['true', 'false'], nullable: true }
        season_name: { type: string, nullable: true }
        episode_display: { type: string, nullable: true }
        license_identifier: { type: string, nullable: true }
        license_url: { type: string, format: uri, nullable: true }

    Person:
      type: object
      properties:
        id: { type: integer }
        podcast_id: { type: integer }
        name: { type: string }
        img_url: { type: string, nullable: true }
        href: { type: string, nullable: true }
        default_role: { type: string }
        default_group: { type: string }
        auto_attach: { type: integer, description: '1 = attach to every newly-created episode.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EpisodePerson:
      type: object
      properties:
        id: { type: integer }
        episode_id: { type: integer }
        person_id: { type: integer }
        role: { type: string, description: 'Frozen at attach time.' }
        group: { type: string, description: 'Frozen at attach time.' }
        position: { type: integer }
        name: { type: string, description: "Live from the person's record." }
        img_url: { type: string, nullable: true }
        href: { type: string, nullable: true }

    Distribution:
      type: object
      properties:
        id: { type: integer }
        podcast_id: { type: integer }
        name: { type: string, example: Apple Podcasts }
        url: { type: string, nullable: true }
        platform_id: { type: string, nullable: true, description: 'Platform-specific show ID.' }
        notes: { type: string, nullable: true }
        position: { type: integer, description: 'Display order, ascending.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UploadResult:
      type: object
      properties:
        url: { type: string, format: uri }
        filename: { type: string }
        size: { type: integer }
        content_type: { type: string }
        kind: { type: string, enum: [audio, artwork, transcript, chapters] }

    StorageMigration:
      type: object
      properties:
        id: { type: integer }
        podcast_id: { type: integer }
        status: { type: string, enum: [pending, running, complete, failed] }
        source_adapter: { type: string }
        target_adapter: { type: string }
        files_total: { type: integer }
        files_done: { type: integer }
        files_failed: { type: integer }
        bytes_total: { type: integer }
        bytes_done: { type: integer }
        current_file: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        podcast_id: { type: integer, nullable: true }
        user_id: { type: integer, nullable: true }
        user_email: { type: string, nullable: true, description: 'null for system events (e.g. scheduled-publish flips).' }
        action: { type: string, example: 'episode.publish' }
        entity_type: { type: string, nullable: true }
        entity_id: { type: integer, nullable: true }
        summary: { type: string, nullable: true }
        details:
          type: object
          nullable: true
          description: 'Free-form. Settings/episode updates include `changed[]`, `before`, `after`.'
          additionalProperties: true
        created_at: { type: string, format: date-time }


    Network:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NetworkListItem:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        podcast_count: { type: integer }

    NetworkPodcast:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        image_url: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        status: { type: string, nullable: true, description: "Included by admin endpoints so soft-deleted members are visible; omitted from the public network detail." }
        position: { type: integer }
        properties:
          type: object
          nullable: true
          description: "Present only when the network detail endpoint is called with ?include=properties. Keys are property keys; values are type-coerced per the property definition."
          additionalProperties: true

    NetworkPropertyDefinition:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [string, boolean, number, url, color]
        required: { type: boolean }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NetworkPropertyEntry:
      type: object
      properties:
        podcast_id: { type: integer }
        podcast_slug: { type: string }
        key: { type: string }
        value:
          nullable: true
          description: "Type-coerced per the matching definition (boolean → JSON bool, number → JSON number, others → string)."
        type:
          type: string
          enum: [string, boolean, number, url, color]

    NetworkDetail:
      allOf:
        - $ref: '#/components/schemas/Network'
        - type: object
          properties:
            podcasts:
              type: array
              items: { $ref: '#/components/schemas/NetworkPodcast' }

    NetworkUpcomingEpisode:
      type: object
      properties:
        episode_id: { type: integer }
        episode_title: { type: string }
        episode_slug: { type: string }
        status: { type: string, enum: [scheduled, published] }
        published_at: { type: string, format: date-time }
        episode_type: { type: string }
        podcast_id: { type: integer }
        podcast_slug: { type: string }
        podcast_title: { type: string }
        podcast_image_url: { type: string, nullable: true }
        podcast_timezone: { type: string }
